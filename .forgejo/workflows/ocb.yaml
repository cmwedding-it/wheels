name: Build OCB

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * 0"
  push:
    branches: ["main"]
    paths: [".forgejo/workflows/ocb.yaml", "OCB/**/*"]

env:
  REPOSITORY_URL: https://cmwedding-bot:${{ secrets.FORGEJO_TOKEN }}@git.weddingfactory.eu/api/packages/cmwedding/pypi

jobs:
  build:
    strategy:
      matrix:
        odoo: ["17.0", "18.0"]

    name: Build wheels for ${{ matrix.odoo }}
    runs-on: ubuntu-latest

    steps:
      - id: check
        uses: https://git.weddingfactory.eu/cmwedding/wheels@check-action
        with:
          pypi-base-url: ${{ env.REPOSITORY_URL }}
          pypi-package: odoo
          github-repository: "OCA/OCB"
          unstable-branch: ${{ matrix.odoo }}

      - name: Check out self
        uses: actions/checkout@v6

      - name: Check out source
        if: steps.check.outputs.version != ''
        run: git clone --depth=1 https://github.com/OCA/OCB --branch ${{ matrix.odoo }} src/

      - name: Patch source
        if: steps.check.outputs.version != ''
        run: |
          cd src/

          if [[ -d "../OCB/${{ matrix.odoo }}/patches" ]]; then
            git config --global user.email "ci@git.weddingfactory.eu"
            git config --global user.name "cmwedding[bot]"

            git am "../OCB/${{ matrix.odoo }}/patches"/*
          fi

          cp "../OCB/${{ matrix.odoo }}/pyproject.toml" .
          sed -i 's/%s/${{ steps.check.outputs.version }}/' pyproject.toml

      - name: Setup dependencies
        if: steps.check.outputs.version != ''
        run: |
          python3 -m venv .venv
          source .venv/bin/activate

          pip3 install build wheel setuptools twine
          pip3 install --index-url https://git.weddingfactory.eu/api/packages/cmwedding/pypi/simple/ psycopg2 pycairo

      - name: Build pure Python wheel
        if: steps.check.outputs.version != ''
        run: |
          source .venv/bin/activate

          cd src/
          python3 -m build --wheel

      - name: Publish package distributions to Forgejo
        if: steps.check.outputs.version != ''
        env:
          TWINE_REPOSITORY_URL: ${{ env.REPOSITORY_URL }}
          TWINE_NON_INTERACTIVE: 1
        run: |
          source .venv/bin/activate
          python3 -m twine upload ./dist/*
